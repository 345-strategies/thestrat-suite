[project]
name = "thestrat-replay"
version = "0.1.0"
description = "Minute-by-minute TheStrat Suite state for replaying a trading day"
requires-python = ">=3.10"
license = { text = "MPL-2.0" }
authors = [{ name = "Nate King" }]
dependencies = ["thestrat-grammar"]

[project.optional-dependencies]
dev = ["pytest>=7"]
parquet = ["pandas", "pyarrow"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["thestrat_replay*"]
